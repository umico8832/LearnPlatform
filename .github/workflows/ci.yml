name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test commit message validator
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Validate new commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCED_PUSH: ${{ github.event.forced || 'false' }}
        run: python3 scripts/check-commit-messages.py "$BASE_SHA" "$HEAD_SHA"

      - name: Validate tracked repository layout
        run: python3 scripts/check-repository-layout.py

      - name: Validate code structure limits
        run: python3 scripts/check-code-structure.py

      - name: Validate documentation and project Skills
        run: python3 scripts/check-docs.py

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: learn_platform
          MYSQL_USER: learn
          MYSQL_PASSWORD: learn123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests and quality checks
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/learn_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
          SPRING_DATASOURCE_USERNAME: learn
          SPRING_DATASOURCE_PASSWORD: learn123
          JWT_SECRET: ci-test-jwt-secret-key-for-testing-only
          AI_ENABLED: 'false'
        run: mvn clean verify -B

  backend-integration:
    name: Backend MySQL Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Testcontainers integration tests
        working-directory: backend
        run: mvn test -B -DexcludedGroups= -Dgroups=integration

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with coverage gate
        working-directory: frontend
        run: npm run coverage

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, backend-integration, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t learnplatform-backend ./backend

      - name: Build frontend image
        run: docker build -t learnplatform-frontend ./frontend

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start E2E environment
        env:
          DB_PASSWORD: root123
          JWT_SECRET: ci-e2e-jwt-secret-key-for-testing-only
          FRONTEND_HOST_PORT: 18000
          BACKEND_HOST_PORT: 18080
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait

      - name: Run browser E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:18000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Stop E2E environment
        if: always()
        env:
          DB_PASSWORD: root123
          JWT_SECRET: ci-e2e-jwt-secret-key-for-testing-only
          FRONTEND_HOST_PORT: 18000
          BACKEND_HOST_PORT: 18080
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
