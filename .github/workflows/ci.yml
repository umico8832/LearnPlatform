name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCED_PUSH: ${{ github.event.forced || 'false' }}
        run: >-
          python3 scripts/check-all.py docs
          ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && '--skip-commit-messages' || '' }}

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: learn_platform
          MYSQL_USER: learn
          MYSQL_PASSWORD: learn123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests and quality checks
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/learn_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
          SPRING_DATASOURCE_USERNAME: learn
          SPRING_DATASOURCE_PASSWORD: learn123
          JWT_SECRET: ci-test-jwt-secret-key-for-testing-only
          AI_ENABLED: 'false'
        run: python3 scripts/check-all.py backend

  backend-integration:
    name: Backend MySQL Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Testcontainers integration tests
        run: python3 scripts/check-all.py backend-integration

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend checks
        run: python3 scripts/check-all.py frontend

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, backend-integration, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application images
        run: python3 scripts/check-all.py docker

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: python3 scripts/check-all.py e2e --step dependencies

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: python3 scripts/check-all.py e2e --step tests

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
