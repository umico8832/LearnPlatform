server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: learn-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/learn_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # 缓存类型（redis / simple）
  cache:
    type: ${CACHE_TYPE:simple}

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:604800}  # 默认7天，单位秒

# AI 配置
ai:
  enabled: ${AI_ENABLED:false}
  api-base-url: ${AI_API_BASE_URL:https://api.openai.com/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-3.5-turbo}
  timeout: ${AI_TIMEOUT:30000}
  max-tokens: ${AI_MAX_TOKENS:2000}
  # OpenAI 的 stream_options.include_usage；不兼容的上游可设为 false
  stream-include-usage: ${AI_STREAM_INCLUDE_USAGE:true}
  daily-quota: ${AI_DAILY_QUOTA:50}
  # 按模型填写 USD / 1M tokens 单价；未配置的模型不会计算成本。
  # model-prices:
  #   your-model:
  #     input-per-million: 0.15
  #     output-per-million: 0.60

# Actuator + Prometheus 监控配置
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,prometheus}
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

app:
  cache:
    default-ttl: ${CACHE_DEFAULT_TTL:10m}
    ttl:
      statistics: ${CACHE_TTL_STATISTICS:5m}
      adminStatistics: ${CACHE_TTL_ADMIN_STATISTICS:3m}
      dailyTrend: ${CACHE_TTL_DAILY_TREND:5m}
      courseStats: ${CACHE_TTL_COURSE_STATS:5m}
      learningReport: ${CACHE_TTL_LEARNING_REPORT:10m}
      learningPath: ${CACHE_TTL_LEARNING_PATH:10m}
      knowledgeGraph: ${CACHE_TTL_KNOWLEDGE_GRAPH:10m}
      learningDiagnosis: ${CACHE_TTL_LEARNING_DIAGNOSIS:10m}
      submissionQuality: ${CACHE_TTL_SUBMISSION_QUALITY:30m}
      submissionKPTagging: ${CACHE_TTL_SUBMISSION_KP_TAGGING:30m}
      submissionDifficulty: ${CACHE_TTL_SUBMISSION_DIFFICULTY:30m}
      globalSearch: ${CACHE_TTL_GLOBAL_SEARCH:5m}

# Knife4j 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      display-name: API 接口文档
      paths-to-match: /api/**
