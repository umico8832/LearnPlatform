# 仅用于本地和 CI 的端到端测试，叠加到 docker-compose.yml 使用。
# 使用独立 Compose 项目名：E2E 拥有自己的容器、网络和数据卷，
# `down -v` 只清理 E2E 数据，绝不误删开发环境的持久化数据。
name: learnplatform-e2e

services:
  ai-mock:
    image: python:3.12-alpine
    volumes:
      - ./frontend/e2e/ai-mock.py:/app/ai-mock.py:ro
    command: ["python", "/app/ai-mock.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - learn-platform

  redis:
    container_name: learnplatform-e2e-redis
    # 浏览器测试只使用容器网络；避免占用开发机已有的 6379 端口。
    ports: !reset []

  loki:
    container_name: learnplatform-e2e-loki
    ports: !reset []

  mailpit:
    container_name: learnplatform-e2e-mailpit
    ports: !reset []

  mysql:
    container_name: learnplatform-e2e-mysql

  frontend:
    image: learnplatform-e2e-frontend:latest
    container_name: learnplatform-e2e-frontend
    # 触发前端重建容器，确保 Nginx 重新解析 e2e 后端容器地址。
    labels:
      com.learnplatform.e2e: "true"
    build:
      context: ./frontend
      args:
        VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

  backend:
    image: learnplatform-e2e-backend:latest
    container_name: learnplatform-e2e-backend
    ports: !reset []
    volumes:
      - ./frontend/e2e/fixtures/knowledge:/e2e/knowledge:ro
    environment:
      SPRING_PROFILES_ACTIVE: e2e,docker
      CACHE_TYPE: simple
      # Keep the isolated E2E profile deterministic even when the developer's
      # local .env defines production Turnstile settings.
      TURNSTILE_ENABLED: "true"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      AI_ENABLED: "true"
      AI_API_KEY: "e2e-test-key"
      AI_API_BASE_URL: "http://ai-mock/v1"
      AI_MODEL: "e2e-deterministic"
      AI_TOOLS_SUPPORTED: "true"
      KNOWLEDGE_SNAPSHOT_PATH: "/e2e/knowledge"
    depends_on:
      ai-mock:
        condition: service_healthy

  prometheus:
    container_name: learnplatform-e2e-prometheus

  grafana:
    container_name: learnplatform-e2e-grafana
