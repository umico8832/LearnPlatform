services:
  mysql:
    ports:
      - "127.0.0.1:${DEV_MYSQL_PORT:-13306}:3306"
  mailpit:
    ports:
      - "127.0.0.1:${DEV_SMTP_PORT:-11025}:1025"
  backend:
    environment:
      DB_URL: jdbc:mysql://127.0.0.1:${DEV_MYSQL_PORT:-13306}/learn_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: ${REDIS_HOST_PORT:-6379}
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      FRONTEND_URL: http://localhost:5173
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:8080/api/auth/oauth/callback/google
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: ${DEV_SMTP_PORT:-11025}
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: no-reply@learnplatform.local
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
  frontend:
    build:
      args:
        VITE_API_BASE_URL: /api
        VITE_AI_TIMEOUT: ${VITE_AI_TIMEOUT:-120000}
