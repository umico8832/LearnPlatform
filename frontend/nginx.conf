server {
    listen 80;
    server_name localhost;

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # AI SSE 需要禁用代理缓冲，否则浏览器可能在生成结束后才一次性收到内容。
    location ~ ^/api/ai/(explanation/stream|variant/stream|review-suggestion/stream)$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Knife4j 接口文档代理
    location /doc.html {
        proxy_pass http://backend:8080/doc.html;
        proxy_set_header Host $host;
    }

    location /webjars/ {
        proxy_pass http://backend:8080/webjars/;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
    }
}
