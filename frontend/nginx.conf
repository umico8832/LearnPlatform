server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # Vite 资源名包含内容哈希；缺失资源不能回退到应用 HTML。
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /admin/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 独立管理系统。
    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    client_max_body_size 241m;

    # API 反向代理
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # SSE 需要禁用代理缓冲，并覆盖最长的试卷学习 AI 会话超时。
    location ~ ^/api/(ai/(explanation/stream|variant/stream|review-suggestion/stream|asset/stream)|statistics/ai-advice/stream|review/ai-suggestion/stream|exam/learning-sessions/[^/]+/questions/[^/]+/ai/[^/]+/stream)$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Knife4j 接口文档代理
    location /doc.html {
        proxy_pass http://backend:8080/doc.html;
        proxy_set_header Host $host;
    }

    location /webjars/ {
        proxy_pass http://backend:8080/webjars/;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
    }
}
